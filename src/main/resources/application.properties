spring.application.name=pedidos
server.port=8081

# Base de datos (Render o local)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Servicios externos (usados por Feign o RestTemplate)
inventario.service.url=${INVENTARIO_URL:http://localhost:8082}
producto.service.url=${PRODUCTO_URL:http://localhost:8084/api/productos}
sucursal.service.url=${SUCURSAL_URL:http://localhost:8081/api/sucursales}
usuario.service.url=${USUARIO_URL:http://localhost:8080/api/usuarios}
